# Compila el juego y publica el ejecutable de Windows (y Linux) en GitHub Releases.
# Se lanza al subir una etiqueta de versión (v0.2.0…) o a mano desde la pestaña Actions
# (entonces crea la versión v<versión de package.json>). Los archivos van directos a Releases,
# sin pasar por el almacenamiento de artefactos de Actions.
name: Release desktop build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Proving Grounds ${{ steps.tag.outputs.tag }}
          generate_release_notes: true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save electron@33.2.1 electron-builder@25.1.8
      - run: npx electron-builder --config desktop/electron-builder.yml --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            release/*.exe
            release/*.AppImage
          fail_on_unmatched_files: false
