<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proving Grounds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="./src/game/game.css">
</head>
<body>
  <div id="game"></div>
  <div class="layer" id="bars"></div>
  <div class="layer" id="numbers"></div>
  <div id="bossbar"></div>
  <div id="crosshair"><i class="dot"></i><i class="arc a1"></i><i class="arc a2"></i><i class="arc a3"></i><i class="arc a4"></i></div>

  <div class="hud" id="hint"></div>
  <div class="hud" id="weaponhud">
    <span id="wtype"></span><span id="wname"></span><span id="ammo"></span>
    <div id="slots"></div>
  </div>
  <div class="hud" id="prompt" hidden></div>
  <div class="hud" id="toast"></div>
  <div class="hud" id="loot"></div>
  <div class="hud" id="pickcard" hidden></div>
  <div id="scope"><div class="lens"><i class="h"></i><i class="v"></i><i class="c"></i></div></div>
  <div id="reddot"></div>

  <div class="screen" id="start">
    <div class="start">
      <div class="toprow">
        <span class="eyebrow" data-i18n="ui.eyebrow"></span>
        <label class="langsel"><span data-i18n="ui.language"></span> <select id="lang"></select></label>
      </div>
      <h1 id="start-title" data-i18n="ui.title"></h1>
      <p id="start-text" data-i18n="ui.intro"></p>
      <div class="ctrl">
        <dl><h3 data-i18n="ui.kbm"></h3>
          <dt>WASD</dt><dd data-i18n="c.move"></dd><dt>Mouse</dt><dd data-i18n="c.look"></dd><dt>LMB / RMB</dt><dd data-i18n="c.fire"></dd>
          <dt>R</dt><dd data-i18n="c.reload"></dd><dt>1 · 2 · Q · wheel</dt><dd data-i18n="c.swap"></dd><dt>Shift · Space</dt><dd data-i18n="c.sprint"></dd>
          <dt>F</dt><dd data-i18n="c.inspect"></dd><dt>E</dt><dd data-i18n="c.use"></dd><dt>Tab</dt><dd data-i18n="c.inv"></dd><dt>Esc</dt><dd data-i18n="c.pause"></dd>
        </dl>
        <dl><h3 data-i18n="ui.pad"></h3>
          <dt>Sticks</dt><dd data-i18n="c.sticks"></dd><dt>RT / LT</dt><dd data-i18n="c.fire"></dd>
          <dt>Ⓧ</dt><dd data-i18n="c.reload"></dd><dt>Ⓨ</dt><dd data-i18n="c.swap"></dd><dt>Ⓐ · L3</dt><dd data-i18n="c.sprint"></dd>
          <dt>D-pad ↓</dt><dd data-i18n="c.inspect"></dd><dt>Ⓑ</dt><dd data-i18n="c.use"></dd><dt>View</dt><dd data-i18n="c.inv"></dd><dt>Start</dt><dd data-i18n="c.pause"></dd>
          <dt data-i18n="c.menus"></dt><dd data-i18n="c.menus.d"></dd>
        </dl>
      </div>
      <div><button class="btn" id="play" type="button" data-i18n="ui.play"></button></div>
    </div>
  </div>

  <div class="screen" id="inventory" hidden>
    <div class="frame">
      <header><h1 data-i18n="ui.inventory"></h1><span class="keys" data-i18n="ui.invKeys"></span></header>
      <div class="inv">
        <section><h2 style="margin-bottom:10px" data-i18n="ui.equipped"></h2><div class="equip" id="inv-equip"></div></section>
        <section><h2 style="margin-bottom:10px" data-i18n="ui.backpack"></h2><div class="pack" id="inv-pack"></div></section>
      </div>
      <div class="inv-foot" id="inv-foot"></div>
      <div id="inv-dropzone" data-i18n="ui.dropZone"></div>
      <div><button class="btn ghost" data-close="1" type="button" data-i18n="ui.resume"></button></div>
    </div>
  </div>

  <div class="screen" id="workbench" hidden>
    <div class="frame">
      <header><h1 data-i18n="ui.workbench"></h1><span class="keys" data-i18n="ui.benchKeys"></span></header>
      <div class="bench">
        <section><h2 style="margin-bottom:10px" data-i18n="ui.yourWeapons"></h2><div class="wlist" id="wb-list"></div></section>
        <section style="display:grid;gap:12px"><div class="preview" id="wb-preview"><span class="tag" data-i18n="ui.drag"></span></div><div id="wb-card"></div></section>
        <section><h2 style="margin-bottom:10px" data-i18n="ui.parts"></h2><div class="slotsbox" id="wb-slots"></div></section>
      </div>
      <div><button class="btn ghost" data-close="1" type="button" data-i18n="ui.resume"></button></div>
    </div>
  </div>

  <div id="tooltip" hidden></div>
  <div id="vcursor" hidden></div>
  <script type="module" src="./src/game/main.ts"></script>
</body>
</html>
