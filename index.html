<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proving Grounds</title>
  <link rel="stylesheet" href="./src/game/game.css">
  <link rel="stylesheet" href="./src/game/menus.css">
</head>
<body>
  <div id="game"></div>
  <div class="layer" id="bars"></div>
  <div class="layer" id="numbers"></div>
  <div id="bossbar"></div>
  <div id="crosshair"><i class="dot"></i><i class="arc a1"></i><i class="arc a2"></i><i class="arc a3"></i><i class="arc a4"></i></div>

  <div class="hud" id="hint"></div>
  <div class="hud" id="phealth" hidden><span></span><div class="track"><i></i></div></div>
  <div id="dmgflash"></div>
  <div class="hud" id="weaponhud">
    <span id="wtype"></span><span id="wname"></span><span id="ammo"></span>
    <div id="slots"></div><span id="crhud"></span>
  </div>
  <div class="hud" id="prompt" hidden></div>
  <div class="hud" id="toast"></div>
  <div class="hud" id="loot"></div>
  <div class="hud" id="pickcard" hidden></div>
  <div id="scope"><div class="lens"><i class="h"></i><i class="v"></i><i class="c"></i></div></div>
  <div id="reddot"></div>

  <div class="screen title" id="start">
    <div class="term startwrap">
      <div class="brandcol">
        <div class="brand"><span class="simline"><span class="sim">SIM//</span><span id="start-mode"></span></span>
          <h1 id="start-title" data-i18n="ui.title"></h1><span class="ver" id="start-ver"></span></div>
        <nav class="mainmenu" id="start-menu"></nav>
        <p id="start-text" class="note"></p>
      </div>
      <section class="panel sub" id="start-sub"></section>
      <footer class="foot" id="start-foot"></footer>
    </div>
  </div>

  <div class="screen" id="inventory" hidden>
    <div class="term">
      <header class="termbar"><span class="sim">SIM//</span><h1 data-i18n="ui.inventory"></h1><span class="credits" id="inv-credits"></span><button type="button" class="btn ghost sm" data-close="1" data-i18n="ui.back"></button></header>
      <div class="inv2" id="inv-body"></div>
      <footer class="foot" id="inv-foot"></footer>
    </div>
  </div>

  <div class="screen" id="workbench" hidden>
    <div class="term wide">
      <header class="termbar"><span class="sim">SIM//</span><h1 id="ws-title"></h1><span class="credits" id="ws-credits"></span><button type="button" class="btn ghost sm" data-close="1" data-i18n="ui.back"></button></header>
      <div class="ws">
        <section class="panel wl"><h2 data-i18n="ui.yourWeapons"></h2><div class="tiles list" id="ws-list"></div></section>
        <section class="panel view"><div class="viewport big" id="ws-view"><div class="tags" id="ws-tags"></div></div><div id="ws-card"></div></section>
        <section class="panel side" id="ws-side"></section>
      </div>
      <footer class="foot" id="ws-foot"></footer>
    </div>
  </div>

  <div class="screen" id="shop" hidden>
    <div class="term">
      <header class="termbar"><span class="sim">SIM//</span><h1 data-i18n="shop.title"></h1><span class="lvl" id="shop-level"></span><span class="credits" id="shop-credits"></span><button type="button" class="btn ghost sm" data-close="1" data-i18n="ui.back"></button></header>
      <div class="shopgrid"><section class="tiers" id="shop-tiers"></section><section class="panel hist"><div id="shop-detail" class="sc-detail"></div><h2 data-i18n="shop.history"></h2><ol id="shop-history"></ol></section></div>
      <div class="reveal" id="shop-reveal" hidden></div>
      <footer class="foot" id="shop-foot"></footer>
    </div>
  </div>

  <div class="screen modal" id="dialog" hidden></div>
  <div class="hud" id="savedot" hidden></div>
  <div id="tooltip" hidden></div>
  <div id="vcursor" hidden></div>
  <script type="module" src="./src/game/main.ts"></script>
</body>
</html>
